name: Deploy (disabled)

# Automatic deployment is intentionally disabled until a server and repository
# secrets are configured. Re-enable only after reviewing the SSH target and
# production deployment procedure.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin
            git reset --hard origin/main
            bash ./deploy.sh
