services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      PORT: 8787
      DATABASE_PATH: /app/data/barber.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - barber_data:/app/data
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  barber_data:
