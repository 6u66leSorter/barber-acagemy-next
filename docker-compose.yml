services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-8787}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/barber.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      MAX_HOMEWORK_UPLOAD_MB: ${MAX_HOMEWORK_UPLOAD_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_WEBAPP_AUTH: ${MAX_WEBAPP_AUTH:-strict}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_INIT_DATA_MAX_AGE_SEC: ${MAX_INIT_DATA_MAX_AGE_SEC:-3600}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      APP_NOTIFICATIONS_RETENTION_DAYS: ${APP_NOTIFICATIONS_RETENTION_DAYS:-90}
    volumes:
      - barber_data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  barber_data:
