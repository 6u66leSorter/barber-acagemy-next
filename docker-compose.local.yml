# Подключается только для локальной проверки. Не используйте при публикации.
services:
  api:
    image: barber-academy-next-api:local
    environment:
      NODE_ENV: development
      MAX_WEBAPP_AUTH: off
      DEV_MAX_USER_ID: 1000000001
  web:
    build:
      args:
        VITE_DEMO_MODE: "true"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
  seed:
    image: barber-academy-next-api:local
    environment:
      DATABASE_PATH: /app/data/barber.db
    volumes:
      - barber_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "backend/scripts/seed-demo.mjs"]
    restart: "no"
